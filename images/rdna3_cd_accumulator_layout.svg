<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="880" height="560" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="440" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">RDNA 3 Wave32 — C/D Accumulator Register Layout (FP32, 16×16 output tile)</text>
  <text x="440" y="52" text-anchor="middle" font-size="11" fill="#555">Each output column is split between two lanes: even rows → lane col, odd rows → lane col+16</text>

  <!-- ==== Left: 16x16 D matrix grid ==== -->
  <text x="20" y="80" font-size="13" font-weight="bold" fill="#1a1a2e">Output matrix D (16 rows × 16 cols), row-major</text>

  <!-- Column headers -->
  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="55" y="100">col →</text>
  </g>
  <g font-size="10" fill="#222" text-anchor="middle">
    <text x="80"  y="100">0</text>
    <text x="106" y="100">1</text>
    <text x="132" y="100">2</text>
    <text x="158" y="100">3</text>
    <text x="184" y="100">4</text>
    <text x="210" y="100">5</text>
    <text x="236" y="100">6</text>
    <text x="262" y="100">7</text>
    <text x="288" y="100">8</text>
    <text x="314" y="100">9</text>
    <text x="340" y="100">10</text>
    <text x="366" y="100">11</text>
    <text x="392" y="100">12</text>
    <text x="418" y="100">13</text>
    <text x="444" y="100">14</text>
    <text x="470" y="100">15</text>
  </g>

  <!-- Row labels -->
  <g font-size="10" fill="#333" text-anchor="end">
    <text x="57" y="120">row 0</text>
    <text x="57" y="142">row 1</text>
    <text x="57" y="164">row 2</text>
    <text x="57" y="186">row 3</text>
    <text x="57" y="208">row 4</text>
    <text x="57" y="230">row 5</text>
    <text x="57" y="252">row 6</text>
    <text x="57" y="274">row 7</text>
    <text x="57" y="296">row 8</text>
    <text x="57" y="318">row 9</text>
    <text x="57" y="340">row 10</text>
    <text x="57" y="362">row 11</text>
    <text x="57" y="384">row 12</text>
    <text x="57" y="406">row 13</text>
    <text x="57" y="428">row 14</text>
    <text x="57" y="450">row 15</text>
  </g>

  <!-- Grid cells -->
  <g font-size="8" text-anchor="middle">

    <!-- Row 0 (even) → lane = col -->
    <g fill="#17A2B8" opacity="0.85">
      <rect x="62"  y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="75"  y="121" fill="white">L0</text>
      <rect x="88"  y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="101" y="121" fill="white">L1</text>
      <rect x="114" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="127" y="121" fill="white">L2</text>
      <rect x="140" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="153" y="121" fill="white">L3</text>
      <rect x="166" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="179" y="121" fill="white">L4</text>
      <rect x="192" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="205" y="121" fill="white">L5</text>
      <rect x="218" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="231" y="121" fill="white">L6</text>
      <rect x="244" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="257" y="121" fill="white">L7</text>
      <rect x="270" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="283" y="121" fill="white">L8</text>
      <rect x="296" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="309" y="121" fill="white">L9</text>
      <rect x="322" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="335" y="121" fill="white">L10</text>
      <rect x="348" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="361" y="121" fill="white">L11</text>
      <rect x="374" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="387" y="121" fill="white">L12</text>
      <rect x="400" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="413" y="121" fill="white">L13</text>
      <rect x="426" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="439" y="121" fill="white">L14</text>
      <rect x="452" y="106" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="465" y="121" fill="white">L15</text>
    </g>

    <!-- Row 1 (odd) → lane = col+16 -->
    <g fill="#E8760A" opacity="0.85">
      <rect x="62"  y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="75"  y="143" fill="white">L16</text>
      <rect x="88"  y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="101" y="143" fill="white">L17</text>
      <rect x="114" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="127" y="143" fill="white">L18</text>
      <rect x="140" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="153" y="143" fill="white">L19</text>
      <rect x="166" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="179" y="143" fill="white">L20</text>
      <rect x="192" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="205" y="143" fill="white">L21</text>
      <rect x="218" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="231" y="143" fill="white">L22</text>
      <rect x="244" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="257" y="143" fill="white">L23</text>
      <rect x="270" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="283" y="143" fill="white">L24</text>
      <rect x="296" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="309" y="143" fill="white">L25</text>
      <rect x="322" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="335" y="143" fill="white">L26</text>
      <rect x="348" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="361" y="143" fill="white">L27</text>
      <rect x="374" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="387" y="143" fill="white">L28</text>
      <rect x="400" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="413" y="143" fill="white">L29</text>
      <rect x="426" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="439" y="143" fill="white">L30</text>
      <rect x="452" y="128" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="465" y="143" fill="white">L31</text>
    </g>

    <!-- Row 2 (even) -->
    <g fill="#17A2B8" opacity="0.75">
      <rect x="62"  y="150" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="75"  y="165" fill="white">L0</text>
      <rect x="88"  y="150" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="101" y="165" fill="white">L1</text>
      <rect x="114" y="150" width="416" height="22" stroke="white" stroke-width="0.8"/>
      <text x="322" y="165" fill="white">L2 … L15  (row 2, even)</text>
    </g>

    <!-- Row 3 (odd) -->
    <g fill="#E8760A" opacity="0.75">
      <rect x="62"  y="172" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="75"  y="187" fill="white">L16</text>
      <rect x="88"  y="172" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="101" y="187" fill="white">L17</text>
      <rect x="114" y="172" width="416" height="22" stroke="white" stroke-width="0.8"/>
      <text x="322" y="187" fill="white">L18 … L31  (row 3, odd)</text>
    </g>

    <!-- Rows 4–11: compressed -->
    <rect x="62" y="194" width="416" height="110" fill="#e0f7fa" stroke="#b2ebf2"/>
    <text x="270" y="255" text-anchor="middle" font-size="11" fill="#006064">Rows 4–11: same pattern — even rows → Lanes 0–15, odd rows → Lanes 16–31</text>

    <!-- Row 12 (even) -->
    <g fill="#17A2B8" opacity="0.75">
      <rect x="62"  y="304" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="75"  y="319" fill="white">L0</text>
      <rect x="88"  y="304" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="101" y="319" fill="white">L1</text>
      <rect x="114" y="304" width="416" height="22" stroke="white" stroke-width="0.8"/>
      <text x="322" y="319" fill="white">L2 … L15  (row 12, even)</text>
    </g>

    <!-- Row 13 (odd) -->
    <g fill="#E8760A" opacity="0.75">
      <rect x="62"  y="326" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="75"  y="341" fill="white">L16</text>
      <rect x="88"  y="326" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="101" y="341" fill="white">L17</text>
      <rect x="114" y="326" width="416" height="22" stroke="white" stroke-width="0.8"/>
      <text x="322" y="341" fill="white">L18 … L31  (row 13, odd)</text>
    </g>

    <!-- Row 14 (even) -->
    <g fill="#17A2B8" opacity="0.85">
      <rect x="62"  y="348" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="75"  y="363" fill="white">L0</text>
      <rect x="88"  y="348" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="101" y="363" fill="white">L1</text>
      <rect x="114" y="348" width="416" height="22" stroke="white" stroke-width="0.8"/>
      <text x="322" y="363" fill="white">L2 … L15  (row 14, even)</text>
    </g>

    <!-- Row 15 (odd) -->
    <g fill="#E8760A" opacity="0.85">
      <rect x="62"  y="370" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="75"  y="385" fill="white">L16</text>
      <rect x="88"  y="370" width="26" height="22" stroke="white" stroke-width="0.8"/><text x="101" y="385" fill="white">L17</text>
      <rect x="114" y="370" width="416" height="22" stroke="white" stroke-width="0.8"/>
      <text x="322" y="385" fill="white">L18 … L31  (row 15, odd)</text>
    </g>
  </g>

  <!-- ==== Right: per-lane VGPR breakdown ==== -->
  <text x="530" y="80" font-size="13" font-weight="bold" fill="#1a1a2e">Per-Lane VGPR Breakdown</text>
  <text x="530" y="96" font-size="11" fill="#555">Example: Lane 0 (responsible for col 0)</text>

  <rect x="530" y="103" width="320" height="280" fill="#e3f2fd" stroke="#1565C0" rx="5"/>
  <text x="690" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Lane 0 (covers column 0)</text>

  <g font-size="10" text-anchor="middle">
    <text x="600" y="143" fill="#555">c_frag index</text>
    <text x="720" y="143" fill="#555">Matrix element</text>
    <text x="820" y="143" fill="#555">Row-major position</text>

    <rect x="540" y="148" width="65" height="20" fill="#17A2B8" rx="2"/>
    <text x="572" y="161" fill="white">c_frag[0]</text>
    <rect x="612" y="148" width="115" height="20" fill="#B2EBF2" rx="2"/>
    <text x="669" y="161" fill="#004D40">D[0][0]</text>
    <rect x="734" y="148" width="105" height="20" fill="#e8f5e9" rx="2"/>
    <text x="786" y="161" fill="#2e7d32">row=0, col=0</text>

    <rect x="540" y="172" width="65" height="20" fill="#17A2B8" rx="2"/>
    <text x="572" y="185" fill="white">c_frag[1]</text>
    <rect x="612" y="172" width="115" height="20" fill="#B2EBF2" rx="2"/>
    <text x="669" y="185" fill="#004D40">D[2][0]</text>
    <rect x="734" y="172" width="105" height="20" fill="#e8f5e9" rx="2"/>
    <text x="786" y="185" fill="#2e7d32">row=2, col=0</text>

    <rect x="540" y="196" width="65" height="20" fill="#17A2B8" rx="2"/>
    <text x="572" y="209" fill="white">c_frag[2]</text>
    <rect x="612" y="196" width="115" height="20" fill="#B2EBF2" rx="2"/>
    <text x="669" y="209" fill="#004D40">D[4][0]</text>
    <rect x="734" y="196" width="105" height="20" fill="#e8f5e9" rx="2"/>
    <text x="786" y="209" fill="#2e7d32">row=4, col=0</text>

    <rect x="540" y="220" width="65" height="20" fill="#17A2B8" rx="2"/>
    <text x="572" y="233" fill="white">c_frag[3]</text>
    <rect x="612" y="220" width="115" height="20" fill="#B2EBF2" rx="2"/>
    <text x="669" y="233" fill="#004D40">D[6][0]</text>
    <rect x="734" y="220" width="105" height="20" fill="#e8f5e9" rx="2"/>
    <text x="786" y="233" fill="#2e7d32">row=6, col=0</text>

    <rect x="540" y="244" width="65" height="20" fill="#17A2B8" rx="2"/>
    <text x="572" y="257" fill="white">c_frag[4]</text>
    <rect x="612" y="244" width="115" height="20" fill="#B2EBF2" rx="2"/>
    <text x="669" y="257" fill="#004D40">D[8][0]</text>
    <rect x="734" y="244" width="105" height="20" fill="#e8f5e9" rx="2"/>
    <text x="786" y="257" fill="#2e7d32">row=8, col=0</text>

    <rect x="540" y="268" width="65" height="20" fill="#17A2B8" rx="2"/>
    <text x="572" y="281" fill="white">c_frag[5]</text>
    <rect x="612" y="268" width="115" height="20" fill="#B2EBF2" rx="2"/>
    <text x="669" y="281" fill="#004D40">D[10][0]</text>
    <rect x="734" y="268" width="105" height="20" fill="#e8f5e9" rx="2"/>
    <text x="786" y="281" fill="#2e7d32">row=10, col=0</text>

    <rect x="540" y="292" width="65" height="20" fill="#17A2B8" rx="2"/>
    <text x="572" y="305" fill="white">c_frag[6]</text>
    <rect x="612" y="292" width="115" height="20" fill="#B2EBF2" rx="2"/>
    <text x="669" y="305" fill="#004D40">D[12][0]</text>
    <rect x="734" y="292" width="105" height="20" fill="#e8f5e9" rx="2"/>
    <text x="786" y="305" fill="#2e7d32">row=12, col=0</text>

    <rect x="540" y="316" width="65" height="20" fill="#17A2B8" rx="2"/>
    <text x="572" y="329" fill="white">c_frag[7]</text>
    <rect x="612" y="316" width="115" height="20" fill="#B2EBF2" rx="2"/>
    <text x="669" y="329" fill="#004D40">D[14][0]</text>
    <rect x="734" y="316" width="105" height="20" fill="#e8f5e9" rx="2"/>
    <text x="786" y="329" fill="#2e7d32">row=14, col=0</text>

    <text x="690" y="356" fill="#1565C0" font-size="10">Covers all 8 even rows of column 0</text>
    <text x="690" y="370" fill="#1565C0" font-size="10">Lane 16 covers all 8 odd rows of column 0</text>
  </g>

  <!-- Legend / summary -->
  <rect x="20" y="410" width="840" height="130" fill="#fffde7" stroke="#f9a825" rx="5"/>
  <text x="440" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Write-back Rules Summary</text>

  <g font-size="11" fill="#333">
    <text x="40" y="452">Write-back formula (row-major):  D[row][col]  →  D_buffer[row × 16 + col]</text>
    <text x="40" y="472">Lane i (0 ≤ i ≤ 15): owns 8 even rows (row = 0,2,4,6,8,10,12,14) of column col=i  →  c_frag[0..7]</text>
    <text x="40" y="492">Lane i+16: owns 8 odd rows (row = 1,3,5,7,9,11,13,15) of the same column i  →  c_frag[0..7]</text>
    <text x="40" y="512">Each lane needs 8 FP32 VGPRs (Wave32); Wave64 uses 4 FP32 VGPRs per lane for C/D</text>
  </g>

  <rect x="680" y="445" width="14" height="14" fill="#17A2B8"/>
  <text x="698" y="457" font-size="10" fill="#004D40">even rows → Lanes 0–15</text>
  <rect x="680" y="463" width="14" height="14" fill="#E8760A"/>
  <text x="698" y="475" font-size="10" fill="#5D1F00">odd rows → Lanes 16–31</text>
</svg>
